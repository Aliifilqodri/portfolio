<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Portofolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --rd: #ec1d24;
        --bl: #0b2a6b;
        --ye: #f5c518;
        --ink: #0a0a0a;
        --cd: #fff;
        --tx: #0a0a0a;
        --ln: #0a0a0a;
        --pp: #fff;
        color-scheme: light;
        --d: "Anton", "Impact", sans-serif;
        --b: "Barlow", system-ui, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: calc(66px + env(safe-area-inset-top, 0px));
        background: var(--pp);
      }
      body {
        margin: 0;
        color: var(--tx);
        font: 700 18px/1.55 var(--b);
        background:
          radial-gradient(rgba(226, 54, 54, 0.16) 1.6px, transparent 1.8px) 0
            0/14px 14px,
          var(--pp);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      :focus-visible {
        outline: 4px solid var(--bl);
        outline-offset: 3px;
      }
      .w {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 22px;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: var(--ink);
        border-bottom: 5px solid var(--rd);
      }
      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 60px;
      }
      .lg {
        display: flex;
        gap: 4px;
        margin-left: 14px;
      }
      .lg button {
        font: 400 16px var(--d);
        background: transparent;
        color: #fff;
        border: 2px solid #fff;
        padding: 0 8px;
        cursor: pointer;
      }
      .lg button[aria-pressed="true"] {
        background: var(--ye);
        color: var(--ink);
        border-color: var(--ye);
      }
      .logo {
        font: 400 32px var(--d);
        color: var(--ye);
        letter-spacing: 1px;
        -webkit-text-stroke: 0;
      }
      nav ul {
        display: flex;
        gap: 22px;
        list-style: none;
        margin: 0;
        padding: 0;
        color: #fff;
        font: 400 20px var(--d);
        letter-spacing: 1px;
      }
      nav ul a:hover {
        color: var(--ye);
      }
      @media (max-width: 860px) {
        nav ul {
          display: none;
        }
      }
      .hero {
        background: repeating-conic-gradient(
          from 0deg at 72% 50%,
          var(--ye) 0 7deg,
          #ffd000 7deg 14deg
        );
        border-bottom: 6px solid var(--ln);
        padding: 56px 0 80px;
        overflow: hidden;
      }
      .hero .w {
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        gap: 44px;
        align-items: center;
      }
      @media (max-width: 860px) {
        .hero .w {
          grid-template-columns: 1fr;
        }
      }
      .is {
        display: inline-block;
        background: var(--cd);
        border: 3px solid var(--ln);
        padding: 0 12px;
        font: 400 20px var(--d);
        letter-spacing: 1px;
        margin-bottom: 12px;
      }
      h1 {
        font: 400 clamp(58px, 11vw, 128px)/0.88 var(--d);
        margin: 0;
        color: var(--rd);
        -webkit-text-stroke: 3px var(--ln);
        paint-order: stroke fill;
        text-shadow: 6px 6px 0 var(--ln);
        transform: rotate(-2deg);
        letter-spacing: 2px;
        overflow-wrap: anywhere;
      }
      .role {
        display: inline-block;
        background: var(--bl);
        color: #fff;
        border: 4px solid var(--ln);
        box-shadow: 5px 5px 0 var(--ln);
        font: 400 clamp(22px, 3.4vw, 32px) var(--d);
        letter-spacing: 1px;
        padding: 2px 16px;
        margin: 26px 0 0;
        transform: rotate(1deg);
      }
      .sp {
        position: relative;
        display: block;
        max-width: 440px;
        background: var(--cd);
        border: 4px solid var(--ln);
        border-radius: 30px;
        padding: 14px 20px;
        margin: 26px 0 24px;
      }
      .sp:after {
        content: "";
        position: absolute;
        left: 34px;
        bottom: -18px;
        width: 26px;
        height: 26px;
        background: var(--cd);
        border-right: 4px solid var(--ln);
        border-bottom: 4px solid var(--ln);
        transform: rotate(45deg) skew(10deg, 10deg);
      }
      .bt {
        display: inline-block;
        font: 400 22px var(--d);
        letter-spacing: 1px;
        background: var(--rd);
        color: #fff;
        border: 4px solid var(--ln);
        box-shadow: 5px 5px 0 var(--ln);
        padding: 6px 24px;
        margin: 6px 12px 6px 0;
        cursor: pointer;
      }
      .bt.y {
        background: var(--ye);
        color: var(--ink);
      }
      .bt:hover {
        transform: translate(-2px, -2px) rotate(-1deg);
        box-shadow: 8px 8px 0 var(--ln);
      }
      .ph {
        position: relative;
        aspect-ratio: 4/5;
        max-width: 370px;
        margin-left: auto;
        background: var(--bl);
        border: 6px solid var(--ln);
        box-shadow: 12px 12px 0 var(--ln);
        transform: rotate(2.5deg);
        display: grid;
        place-items: center;
        font: 400 150px var(--d);
        color: var(--ye);
        overflow: hidden;
      }
      .ph img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .ph:after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(rgba(0, 0, 0, 0.35) 2px, transparent 2.2px)
          0 0/9px 9px;
        -webkit-mask: linear-gradient(200deg, transparent 55%, #000);
        mask: linear-gradient(200deg, transparent 55%, #000);
        pointer-events: none;
      }
      .av {
        position: absolute;
        right: 8px;
        top: 8px;
        background: var(--ye);
        border: 3px solid var(--ln);
        font: 400 18px var(--d);
        padding: 0 10px;
        transform: rotate(4deg);
        z-index: 2;
        color: var(--ink);
      }
      .tape {
        background: var(--ink);
        color: var(--ye);
        overflow: hidden;
        border-bottom: 5px solid var(--rd);
      }
      .tape div {
        display: flex;
        gap: 34px;
        width: max-content;
        padding: 8px 0;
        animation: m 26s linear infinite;
        font: 400 26px var(--d);
        letter-spacing: 2px;
      }
      @keyframes m {
        to {
          transform: translateX(-50%);
        }
      }
      section {
        padding: 74px 0 20px;
      }
      .cap {
        display: inline-block;
        background: var(--ye);
        border: 4px solid var(--ln);
        box-shadow: 5px 5px 0 var(--ln);
        font: 400 clamp(30px, 5vw, 48px)/1 var(--d);
        letter-spacing: 1px;
        padding: 4px 18px;
        margin: 0 0 32px;
        transform: rotate(-1.5deg);
        color: var(--ink);
      }
      .ab {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 34px;
      }
      @media (max-width: 860px) {
        .ab {
          grid-template-columns: 1fr;
        }
      }
      .nr {
        background: var(--cd);
        border: 4px solid var(--ln);
        box-shadow: 7px 7px 0 var(--ln);
        padding: 18px 22px;
      }
      .nr p {
        margin: 0 0 12px;
      }
      .nr p:last-child {
        margin: 0;
      }
      .st {
        display: grid;
        gap: 14px;
        align-content: start;
      }
      .st div {
        background: var(--bl);
        color: #fff;
        border: 4px solid var(--ln);
        box-shadow: 5px 5px 0 var(--ln);
        padding: 4px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        transform: rotate(-1deg);
      }
      .st div:nth-child(2) {
        transform: rotate(1deg);
        background: var(--rd);
      }
      .st strong {
        font: 400 44px/1 var(--d);
        color: var(--ye);
        -webkit-text-stroke: 1px var(--ln);
      }
      .gg {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px 36px;
        background: var(--cd);
        border: 4px solid var(--ln);
        box-shadow: 7px 7px 0 var(--ln);
        padding: 24px;
      }
      .gg b {
        display: block;
        font: 400 22px var(--d);
        letter-spacing: 1px;
      }
      .bar {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 4px;
      }
      .bar i {
        height: 18px;
        border: 2px solid var(--ln);
        background: var(--cd);
      }
      .bar i.on {
        background: var(--rd);
      }
      .fl {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }
      .fl button {
        font: 400 20px var(--d);
        letter-spacing: 1px;
        background: var(--cd);
        border: 3px solid var(--ln);
        padding: 2px 18px;
        cursor: pointer;
      }
      .fl button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--ye);
      }
      .pj {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 30px;
      }
      .pc {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        background: var(--cd);
        border: 5px solid var(--ln);
        box-shadow: 8px 8px 0 var(--ln);
        padding: 0;
        cursor: pointer;
      }
      .cw:nth-child(3n + 1) .pc {
        transform: rotate(-0.8deg);
      }
      .cw:nth-child(3n + 2) .pc {
        transform: rotate(0.6deg);
      }
      .cw .pc:hover {
        transform: rotate(0) translate(-3px, -3px);
        box-shadow: 11px 11px 0 var(--bl);
      }
      .pc[hidden] {
        display: none;
      }
      .th {
        position: relative;
        aspect-ratio: 16/10;
        background:
          radial-gradient(rgba(30, 79, 214, 0.5) 2px, transparent 2.3px) 0
            0/10px 10px,
          var(--ye);
        border-bottom: 5px solid var(--ln);
        display: grid;
        place-items: center;
        font: 400 72px var(--d);
        color: var(--rd);
        -webkit-text-stroke: 2px var(--ln);
        overflow: hidden;
      }
      .th img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .th em {
        position: absolute;
        left: 0;
        top: 10px;
        background: var(--rd);
        color: #fff;
        border: 3px solid var(--ln);
        border-left: 0;
        font: 400 17px var(--d);
        font-style: normal;
        letter-spacing: 1px;
        padding: 0 12px;
      }
      .pi {
        padding: 12px 16px 16px;
      }
      .pi h3 {
        font: 400 26px/1.1 var(--d);
        letter-spacing: 1px;
        margin: 0 0 4px;
      }
      .pi p {
        margin: 0;
        font-size: 16px;
        line-height: 1.4;
      }
      .fx {
        position: absolute;
        right: -12px;
        top: -18px;
        background: var(--ye);
        border: 4px solid var(--ln);
        font: 400 26px var(--d);
        padding: 0 10px;
        transform: rotate(9deg) scale(0);
        transition: transform 0.15s;
        z-index: 2;
        clip-path: polygon(
          0 8%,
          10% 0,
          30% 12%,
          55% 0,
          75% 10%,
          100% 0,
          92% 40%,
          100% 70%,
          90% 100%,
          60% 88%,
          30% 100%,
          8% 85%,
          0 55%
        );
        color: var(--ink);
      }
      .pc:hover .fx,
      .pc:focus-visible .fx {
        transform: rotate(9deg) scale(1);
      }
      .ach {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
      .ach .th {
        aspect-ratio: 16/9;
        font-size: 54px;
      }
      .ex {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 26px;
      }
      .ex > div {
        background: var(--cd);
        border: 4px solid var(--ln);
        box-shadow: 7px 7px 0 var(--ln);
        padding: 0 0 16px;
      }
      .ex time {
        display: inline-block;
        background: var(--ye);
        border: 4px solid var(--ln);
        border-left: 0;
        border-top: 0;
        font: 400 20px var(--d);
        letter-spacing: 1px;
        padding: 0 14px;
        margin-bottom: 10px;
        color: var(--ink);
      }
      .ex h3 {
        font: 400 26px/1.1 var(--d);
        letter-spacing: 1px;
        margin: 0 16px;
      }
      .ex small {
        display: block;
        margin: 2px 16px 6px;
        color: var(--bl);
        font-size: 16px;
      }
      .ex p {
        margin: 0 16px;
        font-size: 16px;
        line-height: 1.4;
      }
      .ts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 34px;
      }
      blockquote {
        position: relative;
        margin: 0 0 22px;
        background: var(--cd);
        border: 4px solid var(--ln);
        border-radius: 28px;
        padding: 20px 24px;
      }
      blockquote:after {
        content: "";
        position: absolute;
        left: 40px;
        bottom: -17px;
        width: 24px;
        height: 24px;
        background: var(--cd);
        border-right: 4px solid var(--ln);
        border-bottom: 4px solid var(--ln);
        transform: rotate(45deg) skew(10deg, 10deg);
      }
      blockquote p {
        margin: 0 0 8px;
        font-size: 19px;
      }
      blockquote cite {
        font: 400 20px var(--d);
        letter-spacing: 1px;
        color: var(--rd);
        font-style: normal;
      }
      .ct {
        background: var(--rd);
        color: #fff;
        border: 6px solid var(--ln);
        box-shadow: 12px 12px 0 var(--ln);
        padding: clamp(26px, 6vw, 60px);
        margin-bottom: 24px;
      }
      .ct h2 {
        font: 400 clamp(44px, 8vw, 92px)/0.95 var(--d);
        margin: 0 0 12px;
        letter-spacing: 2px;
        -webkit-text-stroke: 2px var(--ln);
        paint-order: stroke fill;
        text-shadow: 5px 5px 0 var(--ln);
        color: var(--ye);
      }
      .ct p {
        max-width: 480px;
        margin: 0 0 20px;
      }
      .ct .bt {
        background: var(--cd);
        color: var(--tx);
      }
      footer {
        padding: 20px 0 40px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 15px;
      }
      dialog {
        width: min(760px, 94vw);
        max-height: 90vh;
        padding: 0;
        border: 6px solid var(--ln);
        background: var(--cd);
        color: var(--tx);
        box-shadow: 14px 14px 0 var(--rd);
        overflow: auto;
      }
      dialog::backdrop {
        background: rgba(17, 17, 17, 0.78);
      }
      dialog[open] {
        animation: pop 0.22s ease-out;
      }
      @keyframes pop {
        from {
          transform: scale(0.88) rotate(-2deg);
          opacity: 0;
        }
      }
      .mx {
        position: sticky;
        top: 0;
        float: right;
        margin: 10px;
        z-index: 3;
        font: 400 22px var(--d);
        background: var(--rd);
        color: #fff;
        border: 3px solid var(--ln);
        width: 40px;
        height: 40px;
        cursor: pointer;
      }
      .mm img {
        display: block;
        width: 100%;
        border-bottom: 5px solid var(--ln);
      }
      .mm img.gt {
        width: 200px;
        max-width: 42%;
        margin: 14px 24px 0;
        border: 4px solid var(--ln);
        cursor: zoom-in;
      }
      .mm img.gt.big {
        width: auto;
        max-width: calc(100% - 48px);
        cursor: zoom-out;
      }
      .mb {
        padding: 20px 24px 26px;
      }
      .mb .tg {
        display: inline-block;
        background: var(--ye);
        border: 3px solid var(--ln);
        font: 400 18px var(--d);
        letter-spacing: 1px;
        padding: 0 12px;
        margin: 0 8px 8px 0;
        color: var(--ink);
      }
      .mb h3 {
        font: 400 38px/1 var(--d);
        letter-spacing: 1px;
        margin: 4px 0 6px;
      }
      .mb p {
        margin: 0 0 14px;
      }
      .err {
        margin: 60px auto;
        max-width: 560px;
        background: var(--cd);
        border: 5px solid var(--ln);
        box-shadow: 8px 8px 0 var(--rd);
        padding: 20px;
      }
      .ph {
        max-width: 420px;
      }
      .hi {
        position: absolute;
        left: -6px;
        bottom: 18px;
        z-index: 2;
        background: var(--rd);
        color: #fff;
        border: 4px solid var(--ln);
        font: 400 34px var(--d);
        padding: 0 16px;
        transform: rotate(-7deg);
        clip-path: none;
        box-shadow: 4px 4px 0 var(--ln);
      }
      .rv {
        opacity: 0;
      }
      .rv.in {
        opacity: 1;
        animation: slam 0.45s ease-out backwards;
      }
      @keyframes slam {
        from {
          opacity: 0;
          transform: translateY(28px) scale(0.94);
        }
      }
      .hero h1,
      .hero .role,
      .hero .sp {
        animation: slam 0.6s ease-out backwards;
      }
      .hero .role {
        animation-delay: 0.12s;
      }
      .hero .sp {
        animation-delay: 0.24s;
      }
      .cv {
        display: grid;
        grid-template-columns: 1fr 1.4fr;
        gap: 30px;
        align-items: start;
      }
      @media (max-width: 860px) {
        .cv {
          grid-template-columns: 1fr;
        }
      }
      .cv .nr h3 {
        font: 400 34px/1 var(--d);
        letter-spacing: 1px;
        margin: 0 0 8px;
      }
      .pv {
        display: none;
        width: 100%;
        height: 80vh;
        border: 5px solid var(--ln);
        box-shadow: 8px 8px 0 var(--ln);
        background: var(--cd);
      }
      .pv.on {
        display: block;
      }
      .pvh {
        display: grid;
        place-items: center;
        min-height: 240px;
        border: 5px dashed var(--ink);
        background: var(--cd);
        text-align: center;
        padding: 20px;
        font: 400 28px var(--d);
        letter-spacing: 1px;
      }
      .pvh.off {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .rv {
          opacity: 1;
        }
        .rv.in,
        .hero h1,
        .hero .role,
        .hero .sp {
          animation: none;
        }
      }
      .fl button {
        color: var(--tx);
      }
      .ph {
        width: 100%;
      }
      @media (max-width: 860px) {
        .ph {
          order: -1;
          max-width: 300px;
          margin: 0 auto 14px;
        }
      }
      .pg {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .pg button {
        font: 400 22px var(--d);
        background: var(--cd);
        color: var(--tx);
        border: 3px solid var(--ln);
        box-shadow: 3px 3px 0 var(--ln);
        min-width: 44px;
        padding: 0 12px;
        cursor: pointer;
      }
      .pg button[aria-current="true"] {
        background: var(--ink);
        color: var(--ye);
      }
      .pg button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .tw {
        text-align: center;
        margin-top: 22px;
      }
      .ctg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 34px;
        align-items: start;
      }
      @media (max-width: 860px) {
        .ctg {
          grid-template-columns: 1fr;
        }
      }
      .ci a,
      .ci div {
        display: flex;
        gap: 12px;
        align-items: center;
        background: var(--cd);
        color: var(--tx);
        border: 4px solid var(--ln);
        box-shadow: 4px 4px 0 var(--ln);
        padding: 6px 12px;
        margin-bottom: 14px;
        max-width: 420px;
        overflow-wrap: anywhere;
      }
      .ci b {
        background: var(--ye);
        border: 3px solid var(--ln);
        font: 400 18px var(--d);
        padding: 0 8px;
        min-width: 48px;
        text-align: center;
        color: var(--ink);
      }
      .fm {
        background: var(--cd);
        color: var(--tx);
        border: 5px solid var(--ln);
        box-shadow: 8px 8px 0 var(--ln);
        padding: 20px 22px;
      }
      .fm h3 {
        font: 400 32px var(--d);
        letter-spacing: 1px;
        margin: 0 0 12px;
      }
      .fm label {
        display: block;
        font: 400 19px var(--d);
        letter-spacing: 1px;
        margin-bottom: 2px;
      }
      .fm input,
      .fm textarea {
        width: 100%;
        border: 3px solid var(--ln);
        padding: 10px 12px;
        font: 700 17px var(--b);
        color: var(--tx);
        background: var(--cd);
        margin-bottom: 14px;
        border-radius: 0;
      }
      .fm textarea {
        min-height: 120px;
        resize: vertical;
      }
      .fm .bt {
        width: 100%;
        margin: 0;
        text-align: center;
      }
      .fm iframe,

              st.textContent = e.message || "Gagal";
              add.disabled = false;
            };
            if (ULK === "ultah") {
              var y = c3.value.trim() ? +c3.value : null;
              if (y && (y < 1900 || y > now.getFullYear())) {
                st.textContent =
                  "Tahun lahir tidak valid (kosongkan kalau tidak tahu).";
                add.disabled = false;
                return;
              }
              ulSave(
                ULT.concat([
                  {
                    id: rid(),
                    nama: n,
                    d: ULS.d,
                    m: ULS.m,
                    y: y,
                    catatan: b2.value.trim(),
                  },
                ]),
              )
                .then(drawUl)
                .catch(done);
            } else {
              PLN.events.push({
                id: rid(),
                judul: n,
                tgl: sk,
                jam: c3.value || "",
                catatan: b2.value.trim(),
              });
              plSave()
                .then(drawUl)
                .catch(function (e) {
                  PLN.events.pop();
                  done(e);
                });
            }
          };
          add.onclick = go;
          [a, b2, c3].forEach(function (x) {
            x.onkeydown = function (e) {
              if (e.key === "Enter") {
                e.preventDefault();
                go();
              }
            };
          });
          f.append(a, b2, c3, add);
          pn.append(f, st);
          box.append(pn);
          fo = a;
        }
        var up = PLN.events
          .filter(function (e) {
            return e.tgl >= tk;
          })
          .sort(function (x, y) {
            return x.tgl + (x.jam || "99") < y.tgl + (y.jam || "99") ? -1 : 1;
          })
          .slice(0, 10);
        if (up.length) {
          box.append(el("h4", "tds", "Event mendatang"));
          up.forEach(function (e) {
            var dd = Math.round(
                (new Date(e.tgl + "T00:00:00") -
                  new Date(now.getFullYear(), now.getMonth(), now.getDate())) /
                  864e5,
              ),
              info = el("div", "uli"),
              pr = e.tgl.split("-");
            info.append(
              el("b", "", e.judul),
              el(
                "small",
                "",
                +pr[2] + " " + ULN[+pr[1] - 1] + (e.jam ? " - " + e.jam : ""),
              ),
            );
            if (e.catatan) info.append(el("small", "", e.catatan));
            var row = ulRow(info, [
              ulBtn("Hapus", function () {
                if (!confirm("Hapus event " + e.judul + "?")) return;
                PLN.events = PLN.events.filter(function (q) {
                  return q.id !== e.id;
                });
                plSave().then(drawUl).catch(ulFail);
              }),
            ]);
            row.prepend(
              el(
                "span",
                "ulb" + (dd <= 1 ? " now" : ""),
                dd === 0 ? "HARI INI!" : dd === 1 ? "BESOK" : dd + " hari",
              ),
            );
            box.append(row);
          });
        }
        var rows = ULT.map(function (z) {
          return { z: z, r: ulDays(z, now) };
        }).sort(function (x, y) {
          return x.r.days - y.r.days;
        });
        box.append(el("h4", "tds", "Ulang tahun terdekat"));
        if (!rows.length)
          box.append(
            el("p", "", "Belum ada. Klik salah satu tanggal di kalender."),
          );
        rows.forEach(function (o) {
          var z = o.z,
            r = o.r,
            info = el("div", "uli");
          info.append(
            el("b", "", z.nama),
            el(
              "small",
              "",
              z.d + " " + ULN[z.m - 1] + (r.age ? " - ke-" + r.age : ""),
            ),
          );
          if (z.catatan) info.append(el("small", "", z.catatan));
          var row = ulRow(info, [
            ulBtn("Edit", function () {
              ulForm(z);
            }),
            ulBtn("Hapus", function () {
              if (!confirm("Hapus " + z.nama + "?")) return;
              ulSave(
                ULT.filter(function (q) {
                  return q.id !== z.id;
                }),
              )
                .then(drawUl)
                .catch(ulFail);
            }),
          ]);
          row.prepend(
            el(
              "span",
              "ulb" + (r.days <= 1 ? " now" : ""),
              r.days === 0
                ? "HARI INI!"
                : r.days === 1
                  ? "BESOK"
                  : r.days + " hari",
            ),
          );
          box.append(row);
        });
        return fo;
      }
      function ulTodo(box) {
        var key = plKey(new Date()),
          T = PLN.todos;
        var f = el("div", "ulf"),
          tx = el("input"),
          dt = el("input"),
          add = el("button", "bt", "+ Tambah"),
          st = el(
            "p",
            "hint",
            "Kosongkan tanggal = to-do harian (muncul setiap hari, dan hilang dari daftar kalau sudah dicentang hari itu).",
          );
        tx.type = "text";
        tx.placeholder = "To-do baru (mis. olahraga, kerjakan tugas)";
        tx.maxLength = 120;
        dt.type = "date";
        dt.title = "Tanggal (opsional)";
        add.type = "button";
        var go = function () {
          var t = tx.value.trim();
          if (!t) {
            st.textContent = "Isi to-do dulu.";
            tx.focus();
            return;
          }
          add.disabled = true;
          T.push({ id: rid(), t: t, tgl: dt.value || "", done: "" });
          plSave()
            .then(drawUl)
            .catch(function (e) {
              T.pop();
              st.textContent = e.message || "Gagal";
              add.disabled = false;
            });
        };
        add.onclick = go;
        [tx, dt].forEach(function (x) {
          x.onkeydown = function (e) {
            if (e.key === "Enter") {
              e.preventDefault();
              go();
            }
          };
        });
        f.append(tx, dt, add);
        box.append(f, st);
        var row = function (t) {
          var d = plDone(t, key),
            r = el("div", "tdr" + (d ? " dn" : "")),
            cb = el("input"),
            tt = el("span", "tt", t.t),
            pr = t.tgl ? t.tgl.split("-") : null;
          cb.type = "checkbox";
          cb.checked = d;
          cb.setAttribute("aria-label", t.t);
          cb.onchange = function () {
            var prev = t.done;
            t.done = d ? "" : key;
            plSave()
              .then(drawUl)
              .catch(function (e) {
                t.done = prev;
                ulFail(e);
              });
          };
          r.append(
            cb,
            tt,
            el(
              "small",
              t.tgl && t.tgl < key && !d ? "late" : "",
              t.tgl
                ? (t.tgl < key && !d ? "terlambat - " : "") +
                    +pr[2] +
                    " " +
                    ULN[+pr[1] - 1].slice(0, 3)
                : "harian",
            ),
            ulBtn("Hapus", function () {
              PLN.todos = PLN.todos.filter(function (q) {
                return q.id !== t.id;
              });
              plSave().then(drawUl).catch(ulFail);
            }),
          );
          return r;
        };
        var sec = function (title, list) {
          if (!list.length) return;
          box.append(el("h4", "tds", title));
          list.forEach(function (t) {
            box.append(row(t));
          });
        };
        sec(
          "Hari ini",
          T.filter(function (t) {
            return !plDone(t, key) && (!t.tgl || t.tgl <= key);
          }),
        );
        sec(
          "Mendatang",
          T.filter(function (t) {
            return t.tgl > key && !t.done;
          }).sort(function (x, y) {
            return x.tgl < y.tgl ? -1 : 1;
          }),
        );
        sec(
          "Selesai hari ini",
          T.filter(function (t) {
            return t.done === key;
          }),
        );
        if (!T.length)
          box.append(el("p", "", "Belum ada to-do. Tambahkan di atas."));
        var old = T.filter(function (t) {
          return t.tgl && t.done && t.done < key;
        });
        if (old.length)
          box.append(
            ulBtn(
              "Bersihkan " + old.length + " to-do lama yang sudah selesai",
              function () {
                PLN.todos = PLN.todos.filter(function (t) {
                  return !(t.tgl && t.done && t.done < key);
                });
                plSave().then(drawUl).catch(ulFail);
              },
            ),
          );
        return tx;
      }
      function openUltah() {
        var dg = document.getElementById("dlg");
        if (ULT === null) {
          dg.innerHTML = "";
          dg.append(el("div", "edb", "Memuat..."));
          if (!dg.open) dg.showModal();
          loadUltah(drawUl);
          return;
        }
        drawUl();
        if (!dg.open) dg.showModal();
      }
      function render() {
        start(DT);
      }
      var EDIT = {
        open: function (title, fields, src, onSave, onDel, label) {
          var tmp = JSON.parse(JSON.stringify(src)),
            box = el("div", "edb"),
            x = el("button", "mx", "X");
          x.type = "button";
          x.onclick = function () {
            ed.close();
          };
          box.append(el("h3", "", title));
          fields.forEach(function (f) {
            box.append(field(tmp, f));
          });
          var st = el("p", "hint");
          st.id = "edst";
          box.append(st);
          var bar = el("div", "bar"),
            ok = el("button", "bt", label || "Simpan");
          ok.type = "button";
          ok.onclick = function () {
            ok.disabled = true;
            st.textContent = "Menyimpan...";
            Promise.resolve()
              .then(function () {
                var r = onSave(tmp);
                return r && r.then ? r : EDIT.save();
              })
              .then(function () {
                ed.close();
              })
              .catch(function (e) {
                st.textContent = e.message || "Gagal";
                ok.disabled = false;
              });
          };
          bar.append(ok);
          if (onDel) {
            var d = el("button", "bt rd", "Hapus");
            d.type = "button";
            d.onclick = function () {
              if (!confirm("Hapus item ini?")) return;
              Promise.resolve()
                .then(function () {
                  onDel();
                  return EDIT.save();
                })
                .then(function () {
                  ed.close();
                })
                .catch(function (e) {
                  st.textContent = e.message || "Gagal";
                });
            };
            bar.append(d);
          }
          box.append(bar);
          box.onkeydown = function (e) {
            if (
              e.key === "Enter" &&
              e.target.tagName === "INPUT" &&
              e.target.type !== "file"
            ) {
              e.preventDefault();
              ok.click();
            }
          };
          ed.innerHTML = "";
          ed.append(x, box);
          if (!ed.open) ed.showModal();
        },
        save: function () {
          return api("/api/data", {
            method: "PUT",
            headers: J,
            body: JSON.stringify(DT),
          })
            .then(function (r) {
              DT._v = r.v;
              render();
            })
            .catch(function (e) {
              if (e.status === 401) {
                ADM = false;
                render();
                throw e;
              }
              if (e.status === 409)
                return api("/api/data?t=" + Date.now()).then(function (d) {
                  DT = Object.assign({}, EMPTY, d);
                  render();
                  throw e;
                });
              throw e;
            });
        },
        obj: function (title, key) {
          var t = key === "profil" ? DT : (DT[key] = DT[key] || {}),
            src = {};
          SC[key].forEach(function (f) {
            src[f[0]] = t[f[0]];
          });
          EDIT.open(title, SC[key], src, function (v) {
            Object.assign(t, v);
          });
        },
        val: function (key, label, type) {
          EDIT.open(
            label,
            [["v", label, type]],
            { v: DT[key] || [] },
            function (t) {
              DT[key] = t.v;
            },
          );
        },
        item: function (key, i) {
          var a = DT[key];
          EDIT.open(
            "Edit",
            SC[key],
            a[i],
            function (v) {
              a[i] = v;
            },
            function () {
              a.splice(i, 1);
            },
          );
        },
        add: function (key) {
          var a = (DT[key] = DT[key] || []);
          EDIT.open("Tambah", SC[key], {}, function (v) {
            if (a.indexOf(v) < 0) a.push(v);
          });
        },
        move: function (key, i, d) {
          var a = DT[key],
            j = i + d;
          if (j < 0 || j >= a.length) return;
          var t = a[i];
          a[i] = a[j];
          a[j] = t;
          EDIT.save().catch(function (e) {
            alert(e.message);
          });
        },
        login: function () {
          EDIT.open(
            "Login admin",
            [["password", "Password", "pw"]],
            {},
            function (v) {
              return api("/api/login", {
                method: "POST",
                headers: J,
                body: JSON.stringify({ password: v.password }),
              }).then(function () {
                ADM = true;
                render();
              });
            },
            null,
            "Masuk",
          );
        },
        pw: function () {
          EDIT.open(
            "Ganti password",
            [
              ["lama", "Password lama", "pw"],
              ["baru", "Password baru (minimal 10 karakter)", "pw"],
              ["ulang", "Ulangi password baru", "pw"],
            ],
            {},
            function (v) {
              if (v.baru !== v.ulang)
                return Promise.reject(new Error("Password baru tidak sama"));
              return api("/api/password", {
                method: "POST",
                headers: J,
                body: JSON.stringify({ lama: v.lama, baru: v.baru }),
              }).then(function () {
                alert("Password berhasil diganti.");
              });
            },
            null,
            "Ganti",
          );
        },
        logout: function () {
          api("/api/login", { method: "DELETE" }).then(function () {
            ADM = false;
            render();
          });
        },
      };
      Promise.all([
        api("/api/login").catch(function () {
          return { ok: false };
        }),
        api("/api/data?t=" + Date.now()).catch(function () {
          return {};
        }),
      ]).then(function (r) {
        ADM = !!r[0].ok;
        DT = Object.assign({}, EMPTY, r[1]);
        render();
      });
    </script>
  </body>
</html>
